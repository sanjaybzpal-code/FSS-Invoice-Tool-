<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password — FSS Invoice Generator</title>
<style>
  :root{--navy:#1F3864;--navy2:#2E5496;--bg:#f4f6fa;--line:#dfe3ea;--err:#b42318}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);
    min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;width:380px;max-width:92vw;border:1px solid var(--line);border-radius:14px;
    padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.10)}
  h1{margin:0 0 4px;color:var(--navy);font-size:18px}
  p.sub{margin:0 0 14px;color:#6b7280;font-size:12px}
  label{display:block;font-size:12px;font-weight:600;color:#374151;margin:12px 0 5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px}
  input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(46,84,150,.15)}
  .row{display:flex;gap:10px;margin-top:20px}
  button{flex:1;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
  .primary{background:var(--navy);color:#fff}
  .primary:hover{background:var(--navy2)}
  .ghost{background:#eef2f7;color:var(--navy);text-decoration:none;text-align:center;display:flex;
    align-items:center;justify-content:center}
  .msg{background:#eef6ff;color:#1d4ed8;border:1px solid #cfe0ff;border-radius:8px;
    padding:9px 12px;font-size:13px;margin-top:12px}
</style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('change_password') }}">
    <h1>Change Password</h1>
    <p class="sub">Signed in as <b>{{ user }}</b></p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="msg">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <label for="old_password">Current Password</label>
    <input id="old_password" name="old_password" type="password" required autofocus>
    <label for="new_password">New Password (min 6 characters)</label>
    <input id="new_password" name="new_password" type="password" minlength="6" required>
    <div class="row">
      <a class="ghost" href="{{ url_for('index') }}">Cancel</a>
      <button class="primary" type="submit">Update</button>
    </div>
  </form>
</body>
</html>
